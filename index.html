<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Farmer ID portal – Bandipora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@600&display=swap" rel="stylesheet">
<script>
/* ============ SETTINGS ============ */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby5STKAh0QGza6oGW5hXqZZp2kzst_nxchZzSskZ7mOUk-TTVR6aH7Qw7VAjr3LFZ29Ag/exec";
</script>
<style>
:root{--ink:#1c2a36;--ink-2:#4a5a67;--ink-3:#7c8a95;--paper:#f5f6f3;--card:#fff;--line:#dde2dc;--line-2:#eceee9;--card-line:#c9d0d6;
  --field:#2f6b4f;--brick:#a8432a;--grey:#d5dad6;--focus:#2a6fdb}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#e6ebef;--ink-2:#b3bec7;--ink-3:#86939d;--paper:#141a1f;--card:#1c242b;--line:#2f3a43;--line-2:#252f37;--card-line:#3a4650;
  --field:#6cc19a;--brick:#ef8f76;--grey:#3a4650}}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px 50px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 18px;padding:26px 0 14px}
header div{flex:1;min-width:240px}
h1{font:600 28px/1.15 "IBM Plex Serif",Georgia,serif;margin:0}
.sub{color:var(--ink-2);margin:6px 0 0}
.admin{font-size:14px;color:var(--ink-2);text-decoration:underline}
.card{background:var(--card);border:1px solid var(--card-line);border-radius:12px;padding:18px 20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(20,30,40,.05)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px 20px}
.stat b{display:block;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--ink-2)}
.stat.g b{color:var(--field)} .stat.n b{color:var(--brick)}
.bar{height:10px;border-radius:5px;background:var(--grey);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar.big{margin-top:16px}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--ink-3);margin-top:6px;align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.legend .sp{flex:1}
.linkbtn{background:none;border:0;padding:0;color:var(--ink-2);text-decoration:underline;cursor:pointer;font-size:12px}
.jump{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:4px 0 12px;padding-bottom:2px}
.jump::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--card-line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--tc)}
.chip b{font-weight:600;color:var(--tc)}
.search{width:100%;border:1px solid var(--card-line);border-radius:8px;padding:9px 12px;background:var(--card);margin-bottom:14px;font-size:16px}
.teh{background:var(--card);border:1px solid var(--card-line);border-left:5px solid var(--tc);border-radius:12px;margin-bottom:14px;overflow:hidden;box-shadow:0 1px 2px rgba(20,30,40,.05)}
.th{display:grid;grid-template-columns:1fr auto;gap:6px 16px;padding:14px 16px;cursor:pointer;align-items:center;border:0;background:none;width:100%;text-align:left}
.th:hover{background:color-mix(in srgb,var(--tc) 5%,transparent)}
.th h2{margin:0;font-size:18px;color:var(--tc);display:flex;align-items:center;gap:8px}
.th h2 .car{font-size:12px;color:var(--ink-3);transition:transform .15s}
.teh.shut .car{transform:rotate(-90deg)}
.th .pc{font-size:22px;font-weight:600;color:var(--tc);font-variant-numeric:tabular-nums;text-align:right}
.th .meta{grid-column:1/3;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.th .bar{grid-column:1/3}
.rows{border-top:1px solid var(--line-2)}
.teh.shut .rows{display:none}
.vr{display:grid;grid-template-columns:minmax(140px,1.3fr) 2fr 58px auto;gap:6px 14px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line-2);text-decoration:none}
.vr:last-child{border-bottom:0}
.vr:hover{background:color-mix(in srgb,var(--tc) 5%,transparent)}
.vr .nm{font-weight:600}
.vr .nm small{display:block;font-weight:400;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.vr .p{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.vr .go{font-size:13px;color:var(--tc);white-space:nowrap}
.pill{font-size:11px;border-radius:5px;padding:1px 6px;background:var(--line-2);color:var(--ink-3);font-weight:500;margin-left:4px}
.msg{padding:30px 0;text-align:center;color:var(--ink-3)}
.err{color:var(--brick)}
footer{font-size:13px;color:var(--ink-3);padding-top:6px}
@media (max-width:640px){h1{font-size:23px}.vr{grid-template-columns:1fr 50px}.vr .bar{grid-column:1/3;order:3}.vr .go{display:none}}
@media (prefers-reduced-motion:reduce){.th h2 .car{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Farmer ID portal – <span id="dist">Bandipora</span></h1>
    <p class="sub">Progress of Farmer ID generation against AgriStack land buckets, village by village.</p></div>
    <a class="admin" href="admin.html">Admin login</a>
  </header>

  <section class="card" id="district"><div class="msg">Loading…</div></section>

  <div class="jump" id="jump"></div>
  <input class="search" id="q" type="search" placeholder="Search village" autocomplete="off">
  <div id="tehsils"></div>
  <footer>Tap a village to open its page to view progress or enter data.</footer>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('en-IN');
const pct=(a,b)=>b?Math.round(a*1000/b)/10:0;
const slug=v=>String(v||'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');   // same rule as the generator
// tehsil colours: no green / red / amber, so they never look like progress colours
const PALETTE=['#2b5d9b','#7a3f9d','#3f4fb0','#a3345f','#1f6f8b','#6b4f2a','#5b3fa0','#8a3f7a','#2f4f6f','#556070'];
const tColor=t=>{let h=0; for(const c of String(t)) h=(h*31+c.charCodeAt(0))>>>0; return PALETTE[h%PALETTE.length];};
let D=null, open=new Set(), firstRender=true;

function roll(list){
  const s={villages:list.length,total:0,generated:0,not_generated:0,farmer_ids:0};
  list.forEach(v=>{s.total+=v.total; s.generated+=v.generated; s.not_generated+=v.not_generated; s.farmer_ids+=v.farmer_ids;});
  s.not_claimed=Math.max(0,s.total-s.generated); s.pending=Math.max(0,s.total-s.generated-s.not_generated); s.pct=pct(s.generated,s.total);
  return s;
}
const bar=(s,cls='')=>`<div class="bar ${cls}" role="img" aria-label="${s.pct}% claimed"><i style="width:${s.total?s.generated*100/s.total:0}%;background:var(--field)"></i><i style="width:${s.total?s.not_generated*100/s.total:0}%;background:var(--brick)"></i></div>`;

async function load(){
  try{
    if(!APPS_SCRIPT_URL||APPS_SCRIPT_URL.startsWith('__')) throw new Error('The portal address is not set in index.html.');
    const r=await fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'publicSummary'})});
    const j=await r.json(); if(!j.ok) throw new Error(j.error||'Could not load');
    D=j; render();
  }catch(e){ $('#district').innerHTML=`<div class="msg err">${esc(e.message)} <button class="linkbtn" onclick="load()">Try again</button></div>`; }
}
function render(){
  const q=$('#q').value.trim().toLowerCase();
  const all=D.villages;
  const d=roll(all);
  $('#dist').textContent=D.district;
  $('#district').innerHTML=`<div class="stats">
      <div class="stat"><b>${fmt(d.villages)}</b><span>village${d.villages===1?"":"s"}</span></div>
      <div class="stat"><b>${fmt(d.total)}</b><span>total buckets</span></div>
      <div class="stat g"><b>${fmt(d.generated)}</b><span>buckets claimed</span></div>
      <div class="stat n"><b>${fmt(d.not_claimed)}</b><span>buckets not claimed</span></div>
      <div class="stat"><b>${fmt(d.farmer_ids)}</b><span>Farmer IDs generated</span></div>
      <div class="stat"><b>${d.pct}%</b><span>of buckets claimed</span></div></div>
    ${bar(d,'big')}
    <div class="legend"><span><i style="background:var(--field)"></i>Claimed ${fmt(d.generated)}</span><span><i style="background:var(--brick)"></i>Not generated ${fmt(d.not_generated)}</span><span><i style="background:var(--grey)"></i>Not yet entered ${fmt(d.pending)}</span>
      <span class="sp"></span><span>Updated ${new Date(D.at).toLocaleTimeString([],{timeStyle:'short'})} <button class="linkbtn" id="rf">Refresh</button></span></div>`;
  const tehs=D.tehsils.filter(t=>all.some(v=>v.tehsil===t));
  if(firstRender){ if(tehs.length<=3) tehs.forEach(t=>open.add(t)); firstRender=false; }
  $('#jump').innerHTML=tehs.length>1?tehs.map(t=>{const s=roll(all.filter(v=>v.tehsil===t)); return `<button class="chip" data-t="${esc(t)}" style="--tc:${tColor(t)}"><i></i>${esc(t)} <b>${s.pct}%</b></button>`;}).join(''):'';
  const html=tehs.map(t=>{
    const vs=all.filter(v=>v.tehsil===t&&(!q||v.village.toLowerCase().includes(q))).sort((a,b)=>a.village.localeCompare(b.village));
    if(q&&!vs.length) return '';
    const s=roll(vs), shut=!(open.has(t)||q);
    return `<section class="teh ${shut?'shut':''}" id="t-${slug(t)}" style="--tc:${tColor(t)}">
      <button class="th" data-t="${esc(t)}" aria-expanded="${!shut}">
        <h2><span class="car">▼</span>${esc(t)}</h2><span class="pc">${s.pct}%</span>
        <span class="meta">${s.villages} village${s.villages===1?'':'s'} · ${fmt(s.total)} buckets · ${fmt(s.generated)} claimed · ${fmt(s.not_generated)} not generated · ${fmt(s.pending)} not yet entered · ${fmt(s.farmer_ids)} Farmer IDs</span>
        ${bar(s)}</button>
      <div class="rows">${vs.map(v=>{const r=roll([v]); return `<a class="vr" href="${slug(v.village)}.html">
          <span class="nm">${esc(v.village)}${!v.active?'<span class="pill">closed</span>':''}<small>${fmt(r.generated)} of ${fmt(r.total)} claimed · ${fmt(r.farmer_ids)} IDs${v.last_entry?' · last entry '+new Date(v.last_entry).toLocaleDateString([],{day:'numeric',month:'short'}):''}</small></span>
          ${bar(r)}<span class="p">${r.pct}%</span><span class="go">Open →</span></a>`;}).join('')}</div>
    </section>`;}).join('');
  $('#tehsils').innerHTML=html||`<div class="msg">${q?'No village matches.':'No villages yet.'}</div>`;
}
document.addEventListener('click',e=>{
  if(e.target.id==='rf'){ $('#district').innerHTML='<div class="msg">Loading…</div>'; load(); return; }
  const th=e.target.closest('.th'); if(th){ const t=th.dataset.t; open.has(t)?open.delete(t):open.add(t); render(); return; }
  const c=e.target.closest('.chip'); if(c){ const t=c.dataset.t; open.add(t); render(); document.getElementById('t-'+slug(t)).scrollIntoView({behavior:'smooth',block:'start'}); }
});
$('#q').addEventListener('input',()=>D&&render());
load();
</script>
</body>
</html>
